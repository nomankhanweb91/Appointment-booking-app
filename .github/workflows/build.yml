name: Build Subi Business APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Scaffolding & Inject Project
        run: |
          # 1. Base Flutter Container
          flutter create --org com.example subi_business_app

          # 2. Extract uploaded zip file
          ZIP_NAME=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_NAME" ]; then
            unzip -o "$ZIP_NAME" -d temp/
            if [ -d "temp/subi_business_app" ]; then
              SRC="temp/subi_business_app"
            elif [ -d "temp/subi_premium_pro" ]; then
              SRC="temp/subi_premium_pro"
            else
              SRC="temp"
            fi

            cp -r $SRC/lib/* subi_business_app/lib/
            cp -f $SRC/pubspec.yaml subi_business_app/pubspec.yaml
            if [ -f "$SRC/android/app/src/main/AndroidManifest.xml" ]; then
              cp -f $SRC/android/app/src/main/AndroidManifest.xml subi_business_app/android/app/src/main/AndroidManifest.xml
            fi
          fi

          # 3. Fix Null Safety for Optional Service Price in Appointment View
          sed -i "s/s.amount.toStringAsFixed(0)/(s.amount != null ? '₹' + s.amount\!.toStringAsFixed(0) : 'Included')/g" subi_business_app/lib/screens/appointments/appointment_view_screen.dart
          sed -i "s/'₹\${(s.amount/(s.amount/g" subi_business_app/lib/screens/appointments/appointment_view_screen.dart || true

          # 4. Custom App Icon Setup
          ICON_FILE=$(find . -maxdepth 2 -name "app_icon.png" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            echo "Applying custom app icon: $ICON_FILE"
            RES_DIR="subi_business_app/android/app/src/main/res"
            for d in $RES_DIR/mipmap-*; do
              cp -f "$ICON_FILE" "$d/ic_launcher.png"
            done
          fi

      - name: Build Release APK
        run: |
          cd subi_business_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: subi_business_app/build/app/outputs/flutter-apk/app-release.apk
