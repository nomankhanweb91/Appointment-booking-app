name: Build Subi Business APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Engine
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Scaffolding & Inject Project
        run: |
          # 1. Base Flutter Container
          flutter create --org com.example subi_business_app

          # 2. Extract uploaded zip file
          ZIP_NAME=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_NAME" ]; then
            unzip -o "$ZIP_NAME" -d temp/
            if [ -d "temp/subi_business_app" ]; then
              SRC="temp/subi_business_app"
            elif [ -d "temp/subi_premium_pro" ]; then
              SRC="temp/subi_premium_pro"
            else
              SRC="temp"
            fi

            cp -r $SRC/lib/* subi_business_app/lib/
            cp -f $SRC/pubspec.yaml subi_business_app/pubspec.yaml
            if [ -f "$SRC/android/app/src/main/AndroidManifest.xml" ]; then
              cp -f $SRC/android/app/src/main/AndroidManifest.xml subi_business_app/android/app/src/main/AndroidManifest.xml
            fi
          fi

          # 3. Clean Python Script to Fix Optional Price Null-Safety
          python3 -c '
          import os

          # Fix in appointment_view_screen.dart
          view_file = "subi_business_app/lib/screens/appointments/appointment_view_screen.dart"
          if os.path.exists(view_file):
              with open(view_file, "r") as f:
                  content = f.read()
              content = content.replace(
                  "Text(\x27₹${s.amount.toStringAsFixed(0)}\x27, style: const TextStyle(fontWeight: FontWeight.bold)),",
                  "Text(s.amount != null ? \x27₹${s.amount!.toStringAsFixed(0)}\x27 : \x27Included\x27, style: const TextStyle(fontWeight: FontWeight.bold)),"
              )
              with open(view_file, "w") as f:
                  f.write(content)
              print("Fixed appointment_view_screen null safety.")

          # Fix in theme CardThemeData compatibility if needed
          theme_file = "subi_business_app/lib/theme/app_theme.dart"
          if os.path.exists(theme_file):
              with open(theme_file, "r") as f:
                  t_content = f.read()
              t_content = t_content.replace("cardTheme: CardTheme(", "cardTheme: CardThemeData(")
              with open(theme_file, "w") as f:
                  f.write(t_content)
              print("Fixed CardThemeData compatibility.")
          '

          # 4. Custom App Icon Setup
          ICON_FILE=$(find . -maxdepth 2 -name "app_icon.png" | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            echo "Applying custom app icon: $ICON_FILE"
            RES_DIR="subi_business_app/android/app/src/main/res"
            for d in $RES_DIR/mipmap-*; do
              cp -f "$ICON_FILE" "$d/ic_launcher.png"
            done
          fi

      - name: Build Release APK
        run: |
          cd subi_business_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: subi_business_app/build/app/outputs/flutter-apk/app-release.apk
